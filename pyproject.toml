[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "experiment-craft"
version = "0.2.0"
description = "Reproducible local campaigns and scientific comparisons through optimization-jobs"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["jsonschema>=4.18,<5"]

[project.scripts]
experiment-craft = "experiment_craft.cli:main"

[tool.setuptools.packages.find]
include = ["experiment_craft*"]

[tool.setuptools.package-data]
experiment_craft = ["schemas/*.json"]
