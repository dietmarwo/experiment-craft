name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full_checks:
        description: Also run the check action (fmt, clippy, tests and harnesses of all four repositories)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  WORKSPACE: ${{ github.workspace }}/.baseline

jobs:
  unit:
    name: Unit tests and source verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-baseline.txt
      - run: python -m unittest discover -s tests -v
      - name: Fetch and verify the pinned sources
        run: python scripts/baseline.py fetch --workspace "$WORKSPACE"

  baseline:
    name: Pinned build and smoke jobs (Rust 1.88.0)
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-baseline.txt
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: dtolnay/rust-toolchain@stable
        if: inputs.full_checks
        with:
          components: rustfmt, clippy
      - name: Fetch the pinned sources
        run: python scripts/baseline.py fetch --workspace "$WORKSPACE"
      - uses: Swatinem/rust-cache@v2
        with:
          key: baseline-${{ hashFiles('baseline-lock.json') }}
          workspaces: |
            .baseline/repos/optimization-jobs -> ../../target
            .baseline/repos/fcmaes-rust -> ../../target
            .baseline/repos/LP-IP-craft -> ../../target
            .baseline/repos/SQP-craft -> ../../target
      - name: Build and run the smoke jobs
        run: >-
          python scripts/baseline.py build smoke --workspace "$WORKSPACE"
          --jobs 4 --output "$RUNNER_TEMP/evidence/build-smoke"
      - name: Local campaign acceptance with the real binaries
        run: |
          EXPERIMENT_CRAFT_TEST_BIN_DIR="$WORKSPACE/bin" python tests/integration_campaign.py
          python examples/campaigns/local-mixed/run.py --bin-dir "$WORKSPACE/bin" --output "$RUNNER_TEMP/campaign-demo"
          python examples/campaigns/scientific/run.py --bin-dir "$WORKSPACE/bin" --output "$RUNNER_TEMP/scientific-demo"
          python examples/operations/rehearse.py --bin-dir "$WORKSPACE/bin" --output "$RUNNER_TEMP/operations-demo"
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10.10'
      - name: Recorded verification reports from real scalar and PDE certificates
        env:
          JULIA_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          JULIA_PKG_USE_CLI_GIT: 'true'
        run: |
          export JULIA_DEPOT_PATH="$RUNNER_TEMP/verification-depot"
          julia --startup-file=no --project="$WORKSPACE/repos/fcmaes-rust/tutorials/validated-numerics/julia" -e 'using Pkg; Pkg.instantiate()'
          cargo +1.88.0 build --release --locked \
            --manifest-path "$WORKSPACE/repos/fcmaes-rust/tutorials/validated-numerics/search/Cargo.toml" \
            --target-dir "$RUNNER_TEMP/verification-search"
          python examples/campaigns/certificates/run.py \
            --fcmaes-source "$WORKSPACE/repos/fcmaes-rust" --binary "$RUNNER_TEMP/verification-search/release/cap-search" \
            --julia "$(command -v julia)" --depot "$JULIA_DEPOT_PATH" --runner "$WORKSPACE/bin/optimization-run" \
            --problem scalar-cuberoot --output "$RUNNER_TEMP/evidence/certificate-scalar"
          python examples/campaigns/certificates/run.py \
            --fcmaes-source "$WORKSPACE/repos/fcmaes-rust" --binary "$RUNNER_TEMP/verification-search/release/cap-search" \
            --julia "$(command -v julia)" --depot "$JULIA_DEPOT_PATH" --runner "$WORKSPACE/bin/optimization-run" \
            --problem cahn-hilliard --output "$RUNNER_TEMP/evidence/certificate-pde"
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Dashboard page interactions with real HTTP and native jobs
        run: |
          npm ci --prefix tests/ui --ignore-scripts
          NODE_PATH="$PWD/tests/ui/node_modules" \
            EXPERIMENT_CRAFT_TEST_BIN_DIR="$WORKSPACE/bin" \
            EXPERIMENT_CRAFT_TEST_PYTHON="$(command -v python)" \
            node tests/dashboard_dom.cjs "$RUNNER_TEMP/evidence/dashboard-dom"
      - name: Rendered dashboard in Chromium at phone and desktop sizes
        run: |
          tests/ui/node_modules/.bin/playwright install --with-deps chromium
          NODE_PATH="$PWD/tests/ui/node_modules" \
            EXPERIMENT_CRAFT_TEST_BIN_DIR="$WORKSPACE/bin" \
            EXPERIMENT_CRAFT_TEST_PYTHON="$(command -v python)" \
            node tests/dashboard_browser.cjs "$RUNNER_TEMP/evidence/dashboard-browser"
      - name: Artifact collection and certificate verdicts in Chromium
        run: |
          NODE_PATH="$PWD/tests/ui/node_modules" \
            EXPERIMENT_CRAFT_TEST_BIN_DIR="$WORKSPACE/bin" \
            EXPERIMENT_CRAFT_TEST_PYTHON="$(command -v python)" \
            node tests/dashboard_results_browser.cjs "$RUNNER_TEMP/evidence/dashboard-results-browser"
      - name: Upstream checks
        if: inputs.full_checks
        run: >-
          python scripts/baseline.py check --workspace "$WORKSPACE"
          --jobs 4 --output "$RUNNER_TEMP/evidence/check"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: baseline-evidence
          path: ${{ runner.temp }}/evidence
          if-no-files-found: ignore
